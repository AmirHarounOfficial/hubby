name: hubby_global
description: "Hubby — multi-store commerce control, in your pocket."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.9.2

  # Routing
  go_router: ^17.2.3

  # Storage
  shared_preferences: ^2.5.5

  # UI / charts / icons / fonts
  fl_chart: ^1.2.0
  lucide_icons: ^0.257.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  flutter_svg: ^2.0.10

  # Files / sharing / media
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  path_provider: ^2.1.5

  # Push (kept from the original scaffold)
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  mobile_scanner: ^7.4.0
  sqflite: ^2.4.2+1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Adaptive launcher icon (green square + teal mark). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4dd64d"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"

# Native splash (deep-teal brand background + white wordmark). Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B5A5C"
  image: assets/brand/splash_logo.png
  android: true
  ios: false
  web: false
  fullscreen: true
  android_12:
    color: "#0B5A5C"
    image: assets/brand/splash_android12.png

flutter:
  uses-material-design: true
  assets:
    - assets/saudi_riyal.svg
    - assets/platforms/
    - assets/brand/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.otf
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/Alexandria-Black.ttf
          weight: 900
